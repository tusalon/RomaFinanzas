name: Build Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Verify web app
        run: npm run check

      - name: Prepare signed keystore
        shell: powershell
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_BASE64) {
            throw "Falta el secreto ANDROID_KEYSTORE_BASE64"
          }
          [IO.File]::WriteAllBytes("$pwd\roma-finanzas-release.jks", [Convert]::FromBase64String($env:KEYSTORE_BASE64))

      - name: Sync Capacitor Android
        run: npm run android:sync

      - name: Build signed release
        working-directory: android
        env:
          ROMA_ANDROID_KEYSTORE: ${{ github.workspace }}\roma-finanzas-release.jks
          ROMA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ROMA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ROMA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: .\gradlew.bat assembleRelease bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roma-finanzas-v1.1.0-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: roma-finanzas-v1.1.0-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
