<head>

    <meta name="description" content="Roma Finanzas - Herramienta de gesti&oacute;n financiera para salones de belleza del ecosistema RservasRoma.">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Roma Finanzas">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="apple-touch-icon" href="icons/icon-180x180.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167x167.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180x180.png">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((error) => {
                    console.warn('No se pudo registrar el modo offline:', error);
                });
            });
        }
    </script>

    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/babel.min.js"></script>
    <script src="vendor/supabase.min.js"></script>
    <script src="vendor/tailwind-browser.js"></script>
    <link href="vendor/lucide.css" rel="stylesheet">

    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary: #ec4899; /* Pink-500 */
            --primary-dark: #be185d; /* Pink-700 */
            --primary-light: #fce7f3; /* Pink-100 */
            --bg-color: #f9fafb; /* Gray-50 */
            --text-main: #111827; /* Gray-900 */
            --text-muted: #6b7280; /* Gray-500 */
        }
    }

    @layer base {
        body {
            @apply bg-[var(--bg-color)] text-[var(--text-main)] font-sans antialiased pb-20;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            min-height: 100vh;
            min-height: 100dvh;
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
    }

    @layer components {
        .btn-primary {
            @apply w-full bg-[var(--primary)] text-white font-medium py-3 px-4 rounded-xl shadow-sm active:scale-[0.98] transition-transform duration-150 flex items-center justify-center gap-2;
        }
        .btn-secondary {
            @apply w-full bg-white text-[var(--text-main)] border border-gray-200 font-medium py-3 px-4 rounded-xl shadow-sm active:scale-[0.98] transition-transform duration-150 flex items-center justify-center gap-2;
        }
        .card {
            @apply bg-white rounded-2xl shadow-sm border border-gray-100 p-4;
        }
        .input-field {
            @apply w-full border border-gray-200 rounded-xl px-4 py-3 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[var(--primary)] focus:border-transparent transition-all;
        }
        .label {
            @apply block text-sm font-medium text-gray-700 mb-1.5;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .pt-safe {
            padding-top: env(safe-area-inset-top);
        }
        .mobile-shell {
            min-height: 100dvh;
        }
    }
    </style>
    <style>
        @media (max-width: 480px) {
            .mobile-shell {
                max-width: none;
                box-shadow: none;
            }
        }

        @media (max-width: 380px) {
            .mobile-stack {
                grid-template-columns: 1fr !important;
            }

            .mobile-stack .icon-button {
                width: 100%;
            }

            .mobile-rate-row,
            .mobile-result-row {
                align-items: stretch !important;
                flex-direction: column;
                gap: 0.75rem;
            }

            .mobile-rate-input {
                width: 100% !important;
            }

            .mobile-total-row {
                align-items: flex-start !important;
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- State Management & Mock Data -->
    <script src="vendor/bcrypt.min.js"></script>
    <script type="text/babel" src="utils/supabase.js"></script>

    <script type="text/babel" src="utils/mockData.js"></script>

    <script type="text/babel" src="views/Income.js"></script>

    <script type="text/babel" src="views/Menu.js"></script>

    <script type="text/babel" src="views/Materials.js"></script>
    <script type="text/babel" src="views/CostSheet.js"></script>
    <script type="text/babel" src="views/Config.js"></script>
    
    <!-- Main App -->
    <script type="text/babel" src="app.js"></script>
</body>
</html>
